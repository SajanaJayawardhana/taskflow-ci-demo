<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>TaskFlow</h1>
    <p>A small task list saved in your browser.</p>
    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="row">
        <input id="task-input" maxlength="120" placeholder="e.g. Finish Linux practice" required>
        <button>Add task</button>
      </div>
    </form>
    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="count"></p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
